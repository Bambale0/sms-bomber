[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-bomber"
version = "0.1.0"
description = "Authorized asynchronous Telegram bot for testing allowlisted notification endpoints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.31,<4",
  "aiohttp>=3.14,<4",
  "pydantic-settings>=2.15,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
